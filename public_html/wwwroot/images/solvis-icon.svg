<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background subtle rounded plate -->
    <linearGradient id="solvisPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Top S Ribbon Gradient: Vibrant Cyan to Electric Blue -->
    <linearGradient id="solvisCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Bottom S Ribbon Gradient: Royal Blue to Indigo Purple -->
    <linearGradient id="solvisBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Accent Node Glow -->
    <linearGradient id="solvisAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Drop Shadow for Interlocking Ribbon Depth -->
    <filter id="solvisDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Hexagonal Shield Capsule -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#solvisPlateGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Geometric "S" Form: Upper Dynamic Wave -->
  <path d="M78 28 H44 C34 28 26 36 26 46 C26 55 33 62 42 63 L68 67 C78 68 85 75 85 84 C85 94 77 102 67 102 H32" 
        stroke="url(#solvisCyanGrad)" 
        stroke-width="13" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"
        filter="url(#solvisDepth)"/>

  <!-- Geometric "S" Form: Lower Interlocking Shield Blade -->
  <path d="M42 92 H76 C86 92 94 84 94 74 C94 65 87 58 78 57 L52 53 C42 52 35 45 35 36 C35 26 43 18 53 18 H88" 
        stroke="url(#solvisBlueGrad)" 
        stroke-width="13" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"
        opacity="0.95"/>

  <!-- Central Intelligence Core Node (Cross / Spark of Health & Tech) -->
  <circle cx="60" cy="60" r="6" fill="url(#solvisAccentGrad)"/>
  <circle cx="60" cy="60" r="10" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" fill="none"/>
</svg>